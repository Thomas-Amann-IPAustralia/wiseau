name: Backend tests

# Runs the browser-free, deterministic test suite on every push and PR that
# touches the backend. URL rendering (headless Chromium) is mocked in the
# suite, so no browser is provisioned here — keep it that way to stay fast.

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Tesseract (OCR engine for scanned/handwritten docs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest

  # Builds the production image and proves the heavy path the unit suite mocks:
  # Chromium launches inside the container and a real external URL renders
  # end-to-end. GitHub-hosted runners provide a Docker daemon and direct egress,
  # so unlike the unit job this exercises the browser for real.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t markdown-engine ./backend

      - name: Run container
        run: |
          docker run -d --name md-engine -p 7860:7860 markdown-engine
          # Wait for the app to report healthy (up to ~30s).
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7860/ping; then echo; echo "backend up"; break; fi
            sleep 1
          done
          curl -sf http://localhost:7860/ping >/dev/null || { echo "backend never came up"; docker logs md-engine; exit 1; }

      - name: Confirm Chromium + chromedriver are present and version-matched
        run: |
          docker exec md-engine chromium --version
          docker exec md-engine chromedriver --version

      - name: Confirm Tesseract OCR engine is present in the image
        run: docker exec md-engine tesseract --version

      - name: OCR a scanned page inside the container (end-to-end)
        run: |
          # Build an image-only (no text layer) PDF with PyMuPDF, then run it
          # through the real parser. This proves OCR works in the deployed image
          # (tesseract binary + tessdata discoverable via TESSDATA_PREFIX).
          docker exec -i md-engine python - <<'PY'
          import pymupdf
          from parsers.file_parser import pdf_to_markdown

          src = pymupdf.open()
          src.new_page().insert_text((72, 120), "Container Scanned OCR", fontsize=48)
          pix = src[0].get_pixmap(dpi=200)

          scan = pymupdf.open()
          page = scan.new_page(width=pix.width, height=pix.height)
          page.insert_image(page.rect, pixmap=pix)   # image only: no text layer
          data = scan.tobytes()

          out = pdf_to_markdown(data)
          print("OCR output:", repr(out))
          assert "Container" in out, f"OCR did not recover text: {out!r}"
          print("in-container OCR OK")
          PY

      - name: Render a real external URL end-to-end
        run: |
          body=$(curl -sf --max-time 90 -X POST http://localhost:7860/convert/url \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com"}')
          echo "$body"
          echo "$body" | grep -q "Example Domain" || { echo "expected extracted content not found"; docker logs md-engine; exit 1; }
          # example.com extracts to well under Trafilatura's 250-character
          # threshold, so it is exactly the shape that used to come back with its
          # body duplicated (ADR-020). One copy, on a real page, in the image.
          #
          # The paragraph to count comes out of the *response*, not out of a
          # literal pinned here: example.com rewrote its copy in July 2026 and
          # this step then failed on every branch for a week, reporting a
          # duplication bug when what had actually changed was somebody else's
          # website. What ADR-020 asserts is that the body appears once, and
          # that holds whatever the page happens to say.
          count=$(printf '%s' "$body" | python3 -c '
          import json, sys
          markdown = json.load(sys.stdin)["markdown"]
          paragraph = next(
              (line for line in markdown.splitlines()
               if len(line.strip()) > 30 and not line.startswith(("#", "[", "!"))),
              "",
          )
          if not paragraph:
              sys.exit("no body paragraph in the extracted Markdown")
          print(markdown.count(paragraph))
          ')
          [ "$count" = "1" ] || { echo "short-page body duplicated ($count copies)"; exit 1; }

      - name: Confirm the metrics surface reflects the work just done
        run: |
          # Proves the observability wiring in the *production image*: the URL
          # conversion above must be attributed to a real extraction engine.
          curl -sf http://localhost:7860/metrics | tee /tmp/metrics.json
          python3 - <<'PY'
          import json

          with open("/tmp/metrics.json") as handle:
              m = json.load(handle)
          assert m["conversions"].get("url.ok") == 1, m["conversions"]
          assert m["engines"].get("trafilatura") == 1, m["engines"]
          assert m["requests"]["by_route"]["/convert/url"] == 1, m["requests"]
          assert m["jobs"]["duration"]["count"] == 1, m["jobs"]
          assert m["memory"]["peak_rss_mb"] > 0, m["memory"]
          print("metrics OK")
          PY

      - name: Confirm the image extracts keywords
        run: |
          # Proves the keyword path in the *production image*: `yake` is in the
          # base requirements (ADR-032), so the default method pair must run
          # here, and the two optional methods must be *reported as skipped*
          # rather than failing the request — that degradation is the contract.
          curl -sf --max-time 60 -X POST http://localhost:7860/keywords \
            -H 'Content-Type: application/json' \
            -d @backend/tests/fixtures/ci-keywords-request.json \
            -o /tmp/keywords.json
          cat /tmp/keywords.json
          python3 - <<'PY'
          import json

          with open("/tmp/keywords.json") as handle:
              d = json.load(handle)
          assert "frequency" in d["methods_used"], d["methods_used"]
          assert "yake" in d["methods_used"], "yake ships in requirements.txt"
          assert d["keywords"], "a document about something produced no keywords"
          assert d["keywords"][0]["score"] == 1.0, d["keywords"][0]
          assert d["keywords"][0]["methods"], "no per-method evidence"
          assert "## Keywords" in d["markdown"], "prepend_table returned no table"
          # Whatever is not installed must be *named*, not silently dropped.
          assert set(d["methods_used"]) | set(d["methods_skipped"]) == {
              "frequency", "yake", "spacy", "keybert"
          }, (d["methods_used"], d["methods_skipped"])
          print("keywords OK:", [k["term"] for k in d["keywords"]])
          PY

      - name: Confirm the image serves the MCP connector endpoint
        run: |
          # The deployed container is what an LLM connects to as a connector
          # (ADR-029), so prove the endpoint answers a real MCP handshake from
          # *outside* the container, under a public-looking Host header — the
          # unit suite can only reach it in-process.
          curl -sf http://localhost:7860/ping | grep -q '"mcp_endpoint":"/mcp"' \
            || { echo "image does not advertise an MCP endpoint"; docker logs md-engine; exit 1; }
          body=$(curl -sf --max-time 30 -X POST http://localhost:7860/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Host: wiseau.example.com' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')
          echo "$body"
          echo "$body" | grep -q '"serverInfo"' \
            || { echo "MCP initialize did not succeed"; docker logs md-engine; exit 1; }

      - name: Confirm request logs are structured JSON
        run: |
          docker logs md-engine 2>&1 | grep '"msg": "request"' | tail -3
          docker logs md-engine 2>&1 | grep -q '"path": "/convert/url"' \
            || { echo "no structured access log line for the conversion"; docker logs md-engine; exit 1; }

      - name: Tear down
        if: always()
        run: docker rm -f md-engine || true
